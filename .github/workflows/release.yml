name: build

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pytest -q

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pyinstaller --noconfirm --clean FirestoneClicker.spec
      - name: zip
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          Compress-Archive -Path dist/FirestoneClicker.exe, settings.toml, README.md, LICENSE -DestinationPath "dist/FirestoneClicker-$version-win64.zip"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/FirestoneClicker-*-win64.zip
          generate_release_notes: true
